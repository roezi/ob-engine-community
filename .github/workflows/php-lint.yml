name: PHP Lint

on:
  pull_request:
  push:
    branches: ['obe']

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint and manual smoke tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Check whitespace
        run: git diff --check

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail

          files=()
          for path in ob-engine.php uninstall.php; do
            if [[ -f "$path" ]]; then
              files+=("$path")
            fi
          done

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find includes -type f -name '*.php' -print0 2>/dev/null || true)

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find tests/manual -maxdepth 1 -type f -name '*.php' -print0 2>/dev/null || true)

          if (( ${#files[@]} == 0 )); then
            echo "No PHP files found to lint."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run manual smoke tests without external APIs
        shell: bash
        run: |
          set -euo pipefail
          for smoke in tests/manual/*smoke.php; do
            if [[ -f "$smoke" ]]; then
              php "$smoke"
            fi
          done

      - name: Hardening forbidden pattern check
        shell: bash
        run: |
          set -euo pipefail
          ! rg -n --glob '!docs/**' --glob '!tests/**' --glob '!README.md' --glob '!DESIGN.md' 'Auto publish|Publish now|Write posts now|Run all|Fix everything' .
          ! rg -n --glob '!docs/**' --glob '!tests/**' 'register_rest_route|WP_CLI|wp_schedule_event|wp_cron|MCP runtime|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' .
